<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lampa - Каталог фильмов и сериалов</title>

    <meta name="description" content="Приложение для просмотра каталога фильмов и сериалов на телевизорах, приставках и смартфонах." />

    <meta property="og:title" content="Lampa - Каталог фильмов и сериалов">
    <meta property="og:description" content="Приложение для просмотра каталога фильмов и сериалов на телевизорах, приставках и смартфонах.">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image" content="og.png">

    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="manifest" href="icons/site.webmanifest" crossorigin="use-credentials">
    <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#5bbad5">
    <link rel="shortcut icon" href="icons/favicon.ico">
    <meta name="msapplication-TileColor" content="#1d1f20">
    <meta name="msapplication-config" content="icons/browserconfig.xml">
    <meta name="theme-color" content="#1d1f20">

    <meta name="referrer" content="never">
    
    <link rel="stylesheet" href="./vender/scrollbar/jquery.scrollbar.css">
    <link rel="stylesheet" href="./vender/keypad/style.css">

    <link rel="stylesheet" href="css/app.css?v=4.78">
</head>
<body style="background: #1d1f20;">
    <script>
        window.youtube_lazy_load = true
    </script>

    <div class="welcome"></div>

    <div id="app">

    </div>

    <div class="no-network hide">
        <div class="no-network__title">Ошибка</div>
        <div class="no-network__desc">Не удалось загрузить файл: <span class="no-network__file"></span></div>
    </div>
    
    <script src="./webos/webOSTV.js"></script>
    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scrollbar/jquery.scrollbar.js"></script>
    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>

    <script>
        var lampa_url     = '';
        var cache_version = Math.floor((new Date()).getTime() / 9e5); // Новое значение каждые 15 минут
            
        function urlJoin(base, add) {
            if (base.charAt(base.length - 1) !== '/') {
                base += '/'
            }

            return base + add
        }

        function putScript(scripts, onload, onerror){
            var add = function(src){
                console.log('Loader', 'try-load-script', src)

                var trys = 0

                var sreateScript = function(){
                    var script = document.createElement('script')

                    script.type = 'text/javascript'

                    script.onload = script.onreadystatechange = function(e) {
                        console.log('Loader', 'Script loaded', e)

                        if (!!onload) onload()
                    };

                    script.onerror = function(){
                        trys++

                        console.log('Loader', 'error-load-script', src)

                        if(trys < 3){
                            sreateScript()
                        } else if (!!onerror) {
                            onerror()
                        } else{
                            $('.no-network').removeClass('hide')

                            $('.no-network__file').text(window.location.href + '/' + src)
                        }
                    }

                    script.src = src

                    document.getElementsByTagName('body')[0].appendChild(script)
                }

                sreateScript()
            }

            add(scripts)
        }

        // Fetch official title logos through Lampa's existing TMDB API source (no extra API key).
        var lunoLogoCache = Object.create(null);
        function loadLunoLogo(data, callback) {
            var id = data && data.id;
            var type = data && (data.media_type || data.mediaType);
            if (!type) type = data && data.first_air_date ? 'tv' : 'movie';
            if (!id || (type !== 'movie' && type !== 'tv')) return;
            var key = type + ':' + id;
            if (Object.prototype.hasOwnProperty.call(lunoLogoCache, key)) {
                if (lunoLogoCache[key]) setTimeout(function () { callback(lunoLogoCache[key]); }, 0);
                return;
            }
            var api = window.Lampa && Lampa.Api && Lampa.Api.sources && Lampa.Api.sources.tmdb;
            if (!api || typeof api.get !== 'function') return;
            lunoLogoCache[key] = '';
            try {
                api.get(type + '/' + encodeURIComponent(id) + '/images', {
                    language: 'ru-RU',
                    include_image_language: 'ru,en,null'
                }, function (result) {
                    var logos = result && Array.isArray(result.logos) ? result.logos : [];
                    logos.sort(function (a, b) {
                        function score(item) {
                            var lang = item && item.iso_639_1;
                            return (lang === 'ru' ? 30 : (lang === 'en' ? 20 : (lang === null ? 10 : 0))) +
                                (Number(item && item.vote_average) || 0) / 100;
                        }
                        return score(b) - score(a);
                    });
                    var path = logos.length && logos[0].file_path;
                    var url = path ? 'https://image.tmdb.org/t/p/original' + path : '';
                    lunoLogoCache[key] = url;
                    if (url) callback(url);
                }, function () {
                    lunoLogoCache[key] = '';
                });
            } catch (e) {
                lunoLogoCache[key] = '';
            }
        }

        // Use TMDB landscape backdrops when a card has them; keep Lampa's own card data and navigation.
        function installLunoBackdrops() {
            var root = document.getElementById('app');
            if (!root || root.__lunoBackdropObserver) return;

            function updateBackdrops(scope) {
                var cards = [];
                if (scope && scope.matches && scope.matches('.card')) cards.push(scope);
                if (scope && scope.querySelectorAll) {
                    cards = cards.concat(Array.prototype.slice.call(scope.querySelectorAll('.card')));
                }

                cards.forEach(function(card) {
                    var data = card.card_data;
                    var img = card.querySelector('.card__img');
                    if (!data || !img) return;

                    // Tie the artwork to the current item's own TMDB paths, including reused cards.
                    var itemKey = String(data.id || data.title || data.name || '') + '|' + String(data.media_type || data.mediaType || '');
                    var backdropPath = typeof data.backdrop_path === 'string' && data.backdrop_path.charAt(0) === '/' ? data.backdrop_path : '';
                    var posterPath = typeof data.poster_path === 'string' && data.poster_path.charAt(0) === '/' ? data.poster_path : '';
                    var src = backdropPath
                        ? 'https://image.tmdb.org/t/p/w780' + backdropPath
                        : (posterPath ? 'https://image.tmdb.org/t/p/w500' + posterPath : '');

                    if (src && (img.getAttribute('data-luno-item-key') !== itemKey || img.getAttribute('data-luno-image-path') !== src)) {
                        img.setAttribute('data-luno-item-key', itemKey);
                        img.setAttribute('data-luno-image-path', src);
                        img.src = src;
                    }

                    // Keep the text overlay in sync if Lampa recycles a card for another item.
                    var existingPromo = card.querySelector('.luno-card-promo');
                    if (existingPromo && card.getAttribute('data-luno-promo-key') !== itemKey) {
                        existingPromo.remove();
                        var existingMeta = card.querySelector('.luno-card-meta');
                        if (existingMeta) existingMeta.remove();
                        card.classList.remove('luno-card-enhanced');
                    }

                    // Add native-data promo overlay and metadata strip to every landscape card.
                    if (!card.classList.contains('luno-card-enhanced')) {
                        var view = card.querySelector('.card__view');
                        if (view) {
                            var promo = document.createElement('div');
                            promo.className = 'luno-card-promo';
                            var title = document.createElement('div');
                            title.className = 'luno-card-promo__title';
                            title.textContent = data.title || data.name || '';
                            promo.appendChild(title);

                            // Prefer an official TMDB title logo; retain the text title as a fallback.
                            function applyLunoLogo(logoUrl) {
                                if (!logoUrl || !promo.isConnected || card.getAttribute('data-luno-promo-key') !== itemKey) return;
                                var logo = promo.querySelector('.luno-card-promo__logo');
                                if (!logo) {
                                    logo = document.createElement('img');
                                    logo.className = 'luno-card-promo__logo';
                                    logo.alt = data.title || data.name || '';
                                    logo.loading = 'lazy';
                                    logo.onerror = function() {
                                        logo.remove();
                                        title.classList.remove('luno-card-promo__title--fallback');
                                    };
                                    promo.insertBefore(logo, title);
                                }
                                logo.src = logoUrl;
                                title.classList.add('luno-card-promo__title--fallback');
                            }
                            var suppliedLogo = data.logo || data.logo_path || data.images && data.images.logo;
                            if (typeof suppliedLogo === 'string' && suppliedLogo) {
                                if (suppliedLogo.charAt(0) === '/') suppliedLogo = 'https://image.tmdb.org/t/p/original' + suppliedLogo;
                                if (/^https?:\/\//i.test(suppliedLogo)) applyLunoLogo(suppliedLogo);
                            } else {
                                loadLunoLogo(data, applyLunoLogo);
                            }

                            if (data.overview && typeof data.overview === 'string') {
                                var overview = document.createElement('div');
                                overview.className = 'luno-card-promo__overview';
                                overview.textContent = data.overview;
                                promo.appendChild(overview);
                            }
                            view.appendChild(promo);
                            card.setAttribute('data-luno-promo-key', itemKey);

                            var meta = document.createElement('div');
                            meta.className = 'luno-card-meta';
                            // Show quality only when the item explicitly supplies a recognized quality value.
                            var rawQuality = data.quality || data.video_quality || data.resolution || '';
                            var qualityText = String(rawQuality).trim().toUpperCase().replace(/\\s+/g, '');
                            var qualityAliases = {
                                '4K': '4K', 'UHD': '4K', '2160P': '4K',
                                '1080P': 'FULL HD', 'FHD': 'FULL HD', 'FULLHD': 'FULL HD', 'FULL-HD': 'FULL HD',
                                '720P': 'HD', 'HD': 'HD',
                                '480P': 'SD', 'SD': 'SD'
                            };
                            var quality = qualityAliases[qualityText] || '';
                            if (quality) {
                                var q = document.createElement('span');
                                q.className = 'luno-card-meta__quality';
                                q.textContent = quality;
                                meta.appendChild(q);
                                meta.appendChild(document.createTextNode(' • '));
                            }

                            var rating = data.vote_average || data.vote || data.rating;
                            if (rating !== undefined && rating !== null && rating !== '') {
                                var star = document.createElement('span');
                                star.className = 'luno-card-meta__rating';
                                star.textContent = '★ ' + (Number(rating).toFixed(1));
                                meta.appendChild(star);
                            }

                            var yearSource = data.release_date || data.first_air_date || data.year || '';
                            var year = String(yearSource).match(/(19|20)\d{2}/);
                            if (year) {
                                if (meta.childNodes.length) meta.appendChild(document.createTextNode(' • '));
                                var yearEl = document.createElement('span');
                                yearEl.className = 'luno-card-meta__year';
                                yearEl.textContent = year[0];
                                meta.appendChild(yearEl);
                            }

                            // Use TMDB's media type/date fields to label the content accurately.
                            var mediaType = data.media_type || data.mediaType || '';
                            var isSeries = mediaType === 'tv' || !!data.first_air_date || !!data.origin_country && !!data.name && !data.release_date;
                            var typeLabel = isSeries ? 'СЕРИАЛ' : (mediaType === 'movie' || !!data.release_date || !!data.title ? 'ФИЛЬМ' : '');
                            if (typeLabel) {
                                if (meta.childNodes.length) meta.appendChild(document.createTextNode(' • '));
                                var typeEl = document.createElement('span');
                                typeEl.className = 'luno-card-meta__type';
                                typeEl.textContent = typeLabel;
                                meta.appendChild(typeEl);
                            }

                            if (meta.childNodes.length) promo.appendChild(meta);
                            card.classList.add('luno-card-enhanced');
                        }
                    }
                });
            }

            updateBackdrops(root);
            root.__lunoBackdropObserver = new MutationObserver(function(records) {
                records.forEach(function(record) {
                    Array.prototype.forEach.call(record.addedNodes, function(node) {
                        if (node && node.nodeType === 1) updateBackdrops(node);
                    });
                });
            });
            root.__lunoBackdropObserver.observe(root, { childList: true, subtree: true });

            // Lampa may recycle card nodes without inserting new DOM nodes; reconcile item IDs and image paths.
            root.__lunoBackdropTimer = setInterval(function() {
                updateBackdrops(root);
            }, 1500);
        }

        function loadCurrentLampa() {
            putScript('app.min.js?v=' + cache_version, function () {
                try {
                    if (typeof Lampa !== 'undefined' && Lampa.Listener && !window.__lunoUiErrorWatch) {
                        window.__lunoUiErrorWatch = true;
                        Lampa.Listener.follow('full', function (event) {
                            if (event && event.type === 'complite') {
                                setTimeout(installLunoBackdrops, 250);
                            }
                        });
                    }
                } catch (e) {}
                installLunoBackdrops();
                setTimeout(installLunoBackdrops, 700);
                setTimeout(installLunoBackdrops, 1800);
            })
        }

        function loadLocalLampa(){
            if(lampa_url !== '') window.local_lampa = true

            loadCurrentLampa()
        }

        if (typeof AndroidJS !== "undefined"
            && !!AndroidJS.getLampaURL
            && /^https?:\/\//i.test(AndroidJS.getLampaURL())
            && !/^https?:\/\//i.test(location.href)
        ) {
            lampa_url = urlJoin(AndroidJS.getLampaURL(),'')
        }

        if (lampa_url !== '') {
            putScript(
                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                false,
                function(){}
            )

            putScript(
                urlJoin(lampa_url, 'app.min.js?v=' + cache_version),
                function () {
                    var css = urlJoin(lampa_url, 'css/app.css?v=' + cache_version)

                    $('head').append('<link rel="stylesheet" href="' + css + '">')
                },
                function () {
                    putScript(
                        urlJoin(lampa_url, 'lampa-main/app.min.js?v=' + cache_version),
                        function () {
                            var css = urlJoin(lampa_url, 'lampa-main/css/app.css?v=' + cache_version)

                            $('head').append('<link rel="stylesheet" href="' + css + '">')

                            putScript(
                                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                                false,
                                function(){}
                            )
                        },
                        loadLocalLampa
                    )
                }
            )
        }
        else{
            loadCurrentLampa()
        }
    </script>
</body>
</html>
