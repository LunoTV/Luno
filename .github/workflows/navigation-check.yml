name: Navigation branch check

on:
  push:
    branches: [lampa-prisma-navigation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: npm test
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build LUNO UI
        run: npx vite build
