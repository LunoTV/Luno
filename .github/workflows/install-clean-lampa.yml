name: Install clean Lampa source

on:
  push:
    paths:
      - ".github/workflows/install-clean-lampa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Luno repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import upstream Lampa source
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/yumata/lampa-source.git "$tmp/lampa"
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/install-clean-lampa.yml' "$tmp/lampa/" ./
          rm -rf "$tmp"
      - name: Commit clean Lampa source to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Install clean Lampa source"
          git push origin HEAD:main
