name: Deploy LUNO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luno-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build LUNO
        run: |
          npm install --no-audit --no-fund
          npm run build
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}

      - name: Build pinned headless Lampa runtime
        run: |
          set -euo pipefail
          LAMPA_SHA="b4a13b6af7fe2f3bbbcb91f4eb434ab3378f8d5d"
          git clone https://github.com/yumata/lampa-source.git /tmp/lampa-source
          git -C /tmp/lampa-source checkout --detach "$LAMPA_SHA"
          cd /tmp/lampa-source
          npm install --no-audit --no-fund
          cp "${GITHUB_WORKSPACE}/runtime/headless-params.js" ./src/core/storage/headless-params.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/core/storage/storage.js")
          s = p.read_text()
          old = "import Params from '../../interaction/settings/params'"
          new = "import Params from './headless-params'"
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit("Unable to patch Lampa storage Params import safely")
          p.write_text(s)
          PY
          cp "${GITHUB_WORKSPACE}/runtime/lampa-headless-entry.js" ./luno-headless-entry.js
          cp "${GITHUB_WORKSPACE}/runtime/lampa-source-headless-entry.js" ./luno-source-headless-entry.js
          mkdir -p "${GITHUB_WORKSPACE}/dist/js"
          npx --yes rollup ./luno-headless-entry.js --format iife --file "${GITHUB_WORKSPACE}/dist/js/luno-lampa-runtime.js" --plugin @rollup/plugin-node-resolve --plugin @rollup/plugin-commonjs
          npx --yes rollup ./luno-source-headless-entry.js --format iife --file "${GITHUB_WORKSPACE}/dist/js/luno-lampa-source-runtime.js" --plugin @rollup/plugin-node-resolve --plugin @rollup/plugin-commonjs
          test -s "${GITHUB_WORKSPACE}/dist/js/luno-lampa-runtime.js"
          test -s "${GITHUB_WORKSPACE}/dist/js/luno-lampa-source-runtime.js"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
