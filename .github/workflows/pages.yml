name: Deploy LUNO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Lampa headless runtime
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          LAMPA_SHA="b4a13b6af7fe2f3bbbcb91f4eb434ab3378f8d5d"
          git clone https://github.com/yumata/lampa-source.git /tmp/lampa-source
          git -C /tmp/lampa-source checkout --detach "$LAMPA_SHA"
          cd /tmp/lampa-source
          npm install --no-audit --no-fund
          cp "${GITHUB_WORKSPACE}/runtime/headless-params.js" ./src/core/storage/headless-params.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/core/storage/storage.js")
          s = p.read_text()
          s = s.replace("import Params from '../../interaction/settings/params'", "import Params from './headless-params'")
          p.write_text(s)

          p = Path("src/core/tmdb/tmdb.js")
          s = p.read_text()
          old_key = "return '4ef0d7355d9ffb5151e987764708ce96'"
          if old_key not in s:
              raise SystemExit("Lampa TMDB key function changed; refusing unsafe patch")
          p.write_text(s.replace(old_key, "return ''"))

          p = Path("src/utils/reguest.js")
          s = p.read_text()
          token = __import__('os').environ["TMDB_API_TOKEN"].replace("\\", "\\\\").replace("'", "\\'")
          needle = "        let data = {"
          inject = "        if(params.url.indexOf('api.themoviedb.org/3/') >= 0){ params.headers = Object.assign({}, params.headers || {}, { Authorization: 'Bearer " + token + "' }) }\\n\\n        let data = {"
          if needle not in s:
              raise SystemExit("Lampa request module changed; refusing unsafe patch")
          p.write_text(s.replace(needle, inject, 1))

          p = Path("src/interaction/noty.js")
          p.write_text("""let html = null
function show(){}
function render(){return html}
export default {show,render}
""")
          PY
          cp "${GITHUB_WORKSPACE}/runtime/lampa-headless-entry.js" ./luno-headless-entry.js
          npx rollup ./luno-headless-entry.js --format iife --file "${GITHUB_WORKSPACE}/luno-lampa-runtime.js" --plugin @rollup/plugin-node-resolve --plugin @rollup/plugin-commonjs
          cp "${GITHUB_WORKSPACE}/runtime/lampa-source-headless-entry.js" ./luno-source-headless-entry.js
          npx rollup ./luno-source-headless-entry.js --format iife --file "${GITHUB_WORKSPACE}/luno-lampa-source-runtime.js" --plugin @rollup/plugin-node-resolve --plugin @rollup/plugin-commonjs
          mkdir -p "${GITHUB_WORKSPACE}/dist/js"
          cp "${GITHUB_WORKSPACE}/luno-lampa-runtime.js" "${GITHUB_WORKSPACE}/dist/js/luno-lampa-runtime.js"
          cp "${GITHUB_WORKSPACE}/luno-lampa-source-runtime.js" "${GITHUB_WORKSPACE}/dist/js/luno-lampa-source-runtime.js"
          cp -R "${GITHUB_WORKSPACE}/css" "${GITHUB_WORKSPACE}/dist/css"
          cp -R "${GITHUB_WORKSPACE}/js" "${GITHUB_WORKSPACE}/dist/js-src"
          cp "${GITHUB_WORKSPACE}/js/app.js" "${GITHUB_WORKSPACE}/dist/js/app.js"
          cp "${GITHUB_WORKSPACE}/index.html" "${GITHUB_WORKSPACE}/dist/index.html"
          test -s "${GITHUB_WORKSPACE}/dist/js/luno-lampa-runtime.js"
          test -s "${GITHUB_WORKSPACE}/dist/js/luno-lampa-source-runtime.js"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
