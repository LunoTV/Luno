name: Deploy LUNO
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Lampa core sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lampa-source public/core/lampa
          git clone --depth 1 --filter=blob:none --sparse https://github.com/yumata/lampa-source.git /tmp/lampa-source
          git -C /tmp/lampa-source sparse-checkout set src/core src/utils
          mkdir -p public/core/lampa
          cp -R /tmp/lampa-source/src/core public/core/lampa/core
          cp -R /tmp/lampa-source/src/utils public/core/lampa/utils
          printf '%s\n' 'Lampa core sources imported for the LUNO core rebuild. Lampa UI is intentionally excluded.' > public/core/lampa/README.txt

      - name: Build TMDB catalog
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          if [ -z "${TMDB_API_READ_TOKEN:-}" ]; then
            printf '%s\n' '{"movies":[],"series":[],"generatedAt":null}' > public/data/tmdb.json
            exit 0
          fi
          export AUTH="Authorization: Bearer $TMDB_API_READ_TOKEN"
          for kind in movie tv; do
            for sort in popularity.desc vote_average.desc; do
              for page in $(seq 1 10); do
                curl -fsSL -H "$AUTH" -H "accept: application/json" "https://api.themoviedb.org/3/discover/$kind?language=ru-RU&page=$page&sort_by=$sort&include_adult=false&include_video=false" -o "/tmp/tmdb-${kind}-${sort//./-}-$page.json"
              done
            done
          done
          node - <<'NODE'
          const fs=require('fs');
          const collect=(kind)=>{
            const seen=new Set(), out=[];
            for(const sort of ['popularity-desc','vote_average-desc']){
              for(let p=1;p<=10;p++){
                const file=`/tmp/tmdb-${kind}-${sort}-${p}.json`;
                if(!fs.existsSync(file)) continue;
                const data=JSON.parse(fs.readFileSync(file,'utf8'));
                for(const x of (data.results||[])){ if(seen.has(x.id)) continue; seen.add(x.id); out.push(x); }
              }
            }
            return out;
          };
          fs.writeFileSync('public/data/tmdb.json',JSON.stringify({movies:collect('movie'),series:collect('tv'),generatedAt:new Date().toISOString()}));
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
