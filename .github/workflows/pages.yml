name: Deploy LUNO
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Lampa core sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lampa-source public/core/lampa
          git clone --depth 1 --filter=blob:none --sparse https://github.com/yumata/lampa-source.git /tmp/lampa-source
          git -C /tmp/lampa-source sparse-checkout set src/core src/utils
          mkdir -p public/core/lampa
          cp -R /tmp/lampa-source/src/core public/core/lampa/core
          cp -R /tmp/lampa-source/src/utils public/core/lampa/utils
          printf '%s\n' 'Lampa core sources imported for the LUNO core rebuild. Lampa UI is intentionally excluded.' > public/core/lampa/README.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
