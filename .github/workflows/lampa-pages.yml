name: Build Lampa and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: luno-pages
  cancel-in-progress: true

jobs:
  import-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LUNO repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare complete build pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("gulpfile.js")
          source = path.read_text()
          old = "exports.pack_github  = series(sync_github, uglify_task, public_github, write_manifest, index_github);"
          new = "exports.pack_github  = series(merge, plugins, sass_task, lang_task, sync_github, uglify_task, public_github, write_manifest, index_github);"
          if old not in source:
              raise SystemExit("Could not find the expected upstream pack_github task definition")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Lampa web distribution
        run: npx gulp pack_github

      - name: Prepare and verify Prisma-style Lampa distribution
        run: |
          set -euo pipefail
          test -s build/github/lampa/index.html
          test -s build/github/lampa/app.min.js
          test -s build/github/lampa/css/app.css
          test -s build/github/lampa/assembly.json
          # Publish the complete, original Lampa UI/runtime. Keep the former
          # LUNO shell only in its backup branch; do not overwrite Lampa's index.
          cp prisma-theme.css build/github/lampa/prisma-theme.css
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path("build/github/lampa")
          version = os.environ.get("GITHUB_SHA", "latest")[:12]
          index = root / "index.html"
          html = index.read_text()
          marker = '</head>'
          link = f'    <link rel="stylesheet" href="./prisma-theme.css?v={version}">\n'
          if 'prisma-theme.css' not in html:
              if marker not in html:
                  raise SystemExit("Could not locate </head> in original Lampa index")
              html = html.replace(marker, link + marker, 1)
          html = html.replace('<title>Lampa</title>', '<title>LUNO</title>')
          index.write_text(html)
          PY
          test -s build/github/lampa/prisma-theme.css
          grep -q 'prisma-theme.css' build/github/lampa/index.html
          echo "Original Lampa UI preserved with LUNO Prisma-style theme."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/github/lampa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
