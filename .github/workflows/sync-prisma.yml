name: Materialize Prisma Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "public/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget
      - name: Materialize Prisma Web
        run: npm run sync:prisma
      - name: Validate entry point
        run: test -s public/index.html
      - name: Commit generated web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No Prisma Web changes."
            exit 0
          fi
          git commit -m "build: materialize Prisma Web"
          git push
