name: Deploy LUNO

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LUNO
        uses: actions/checkout@v4
      - name: Checkout upstream Lampa
        uses: actions/checkout@v4
        with:
          repository: yumata/lampa
          ref: main
          path: upstream
      - name: Assemble LUNO
        shell: bash
        run: |
          mkdir -p _site
          cp -a upstream/. _site/
          rm -rf _site/.git _site/.github
          cp prisma-theme.css _site/prisma-theme.css
          cp luno-boot.js _site/luno-boot.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          html = p.read_text(encoding="utf-8")
          if "</head>" not in html or "</body>" not in html:
              raise SystemExit("Upstream index.html has unexpected structure; refusing to publish.")
          html = html.replace("</head>", '\n<link rel="stylesheet" href="./prisma-theme.css">\n</head>', 1)
          html = html.replace("</body>", '\n<script src="./luno-boot.js"></script>\n</body>', 1)
          p.write_text(html, encoding="utf-8")
          PY
          cp upstream/LICENSE _site/UPSTREAM-LICENSE 2>/dev/null || true
          printf 'LUNO build\nUpstream: https://github.com/yumata/lampa\nTheme and integration: LunoTV/Luno\n' > _site/LUNO-ATTRIBUTION.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
