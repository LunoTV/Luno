name: Clear main branch

on:
  push:
    paths:
      - ".github/workflows/clear-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove all tracked repository files from main
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -f .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clear all files from main as requested"
          git push origin HEAD:main
