name: Install clean Lampa with Prisma theme

on:
  push:
    paths:
      - ".github/workflows/install-lampa-prisma.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-lampa-prisma
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LUNO repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save workflow and clone clean Lampa source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/luno-workflow
          cp .github/workflows/install-lampa-prisma.yml /tmp/luno-workflow/
          git clone --depth 1 https://github.com/yumata/lampa-source.git /tmp/lampa-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/lampa-source/. .
          mkdir -p .github/workflows
          cp /tmp/luno-workflow/install-lampa-prisma.yml .github/workflows/
          cp /tmp/luno-workflow/install-lampa-prisma.yml /tmp/install-lampa-prisma.yml
          cat > luno-prisma.css <<'CSS'
/* LUNO / Prisma-inspired theme for Lampa. Visual overrides only. */
:root{--luno-bg:#000;--luno-panel:#242526;--luno-panel2:#303133;--luno-line:rgba(255,255,255,.11);--luno-text:#f4f4f4;--luno-muted:#88898d;--luno-accent:#43d6ad}
html,body,.head,.wrap,.activity,.activity__body,body .app,.main,.full-start,.full-descr{background-color:var(--luno-bg)!important;color:var(--luno-text)}
body{color:var(--luno-text)!important}*{scrollbar-color:#454649 #000}
a,button{-webkit-tap-highlight-color:transparent}
.card,.card__view,.card__img,.card__poster,.card__image{border-radius:12px!important;overflow:hidden}
.card__title,.card__name{color:#f4f4f4!important}
.head,.head__title,.head__action,.head__back{color:#f4f4f4!important}.head__title{font-weight:400!important;letter-spacing:-.025em}
.menu,.menu__content,.menu__list,.selectbox,.selectbox__content,.modal,.modal__content,.settings,.settings__content{background:var(--luno-panel)!important;color:var(--luno-text)!important}
.menu__item,.settings__item,.selectbox__item,.modal__button,.item,.settings-param,.settings-param__name{border-radius:15px!important}
.menu__item,.settings__item,.selectbox__item{background:var(--luno-panel2)!important;border:1px solid var(--luno-line)!important;margin:7px 12px}
.menu__item.focus,.settings__item.focus,.selectbox__item.focus,.card.focus .card__view{outline-color:var(--luno-accent)!important}
.button--active,.selector--active,.menu__item.active,.navigation-bar__item.active,.navigation-tabs__item.active{color:var(--luno-accent)!important}
.navigation-bar,.navigation-bar__content,.navigation-tabs,.navigation-tabs__content{background:rgba(37,38,40,.96)!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:999px!important;box-shadow:0 8px 28px rgba(0,0,0,.42);backdrop-filter:blur(18px)}
.navigation-bar__item,.navigation-tabs__item{border-radius:999px!important}.navigation-bar__item.active,.navigation-tabs__item.active{background:rgba(255,255,255,.10)!important}
.search,.search__body,.search__content,.search__input,input,textarea{color:var(--luno-text)!important}
input,textarea,.search__input{background:#252627!important;border:1px solid var(--luno-line)!important;border-radius:16px!important}
@media(max-width:700px){.head{padding-left:18px!important;padding-right:18px!important}.card__view,.card__img,.card__poster{border-radius:11px!important}.menu__item,.settings__item,.selectbox__item{min-height:58px}.navigation-bar,.navigation-tabs{position:fixed;left:12px!important;right:12px!important;bottom:max(8px,env(safe-area-inset-bottom))!important;width:auto!important;z-index:1000}}
CSS
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          if not p.exists():
              raise SystemExit('Expected public/index.html in upstream Lampa source; refusing to commit an incomplete import.')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="./luno-prisma.css">'
          if tag not in s:
              if '</head>' not in s:
                  raise SystemExit('Could not find </head> in public/index.html')
              s = s.replace('</head>', '    ' + tag + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit complete Lampa source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Install clean Lampa source with Prisma-inspired LUNO theme"
          git push origin HEAD:main
