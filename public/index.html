<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><title>LUNO — фильмы и сериалы</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--text:#f5f7fb;--muted:#8d93a3;--accent:#7c5cff;--accent2:#35c7ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit}.luno{min-height:100vh;background:radial-gradient(circle at 75% -10%,rgba(124,92,255,.22),transparent 32%),var(--bg)}.header{height:72px;display:flex;align-items:center;padding:0 28px;gap:28px;position:sticky;top:0;z-index:10;background:rgba(8,9,13,.82);backdrop-filter:blur(18px)}.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:23px;letter-spacing:.08em}.logo-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 30px rgba(124,92,255,.3)}.logo-mark:before{content:"";width:16px;height:16px;border-radius:50%;background:#fff;display:block;transform:translate(2px,-1px);box-shadow:-5px 3px 0 0 var(--accent)}.nav{display:flex;gap:8px}.nav button{border:0;background:transparent;padding:9px 13px;border-radius:10px;cursor:pointer;color:var(--muted)}.nav button.active,.nav button:hover{background:#171923;color:#fff}.search{margin-left:auto;width:min(360px,38vw);height:40px;border:1px solid #252938;background:#11131a;border-radius:12px;color:#fff;padding:0 14px;outline:0}.search:focus{border-color:#4d4770}main{max-width:1400px;margin:auto;padding:34px 28px 70px}.hero{padding:42px 0 34px}.eyebrow{color:#9d91ff;text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:700}.hero h1{font-size:clamp(34px,5vw,62px);line-height:1.02;margin:10px 0 14px}.hero p{max-width:620px;color:var(--muted);font-size:17px;line-height:1.55;margin:0}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section h2{font-size:21px;margin:0}.hint{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}.card{border:0;background:transparent;text-align:left;padding:0;cursor:pointer}.poster{aspect-ratio:2/3;border-radius:13px;background:linear-gradient(145deg,#171a23,#0e1015);border:1px solid #202431;overflow:hidden;display:grid;place-items:center}.poster .mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}.poster .mark:after{content:"L";font-weight:900;font-size:24px}.card-title{margin-top:9px;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{margin-top:4px;color:var(--muted);font-size:12px}@media(max-width:700px){.header{padding:0 15px;height:62px;gap:12px}.nav{display:none}.search{width:150px;margin-left:auto}main{padding:22px 15px 50px}.hero{padding:28px 0 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
</style></head><body><div class="luno"><header class="header"><div class="logo"><span class="logo-mark"></span><span>LUNO</span></div><nav class="nav"><button class="active">Главная</button><button>Фильмы</button><button>Сериалы</button></nav><input id="search" class="search" placeholder="Поиск фильмов и сериалов" autocomplete="off"></header><main><section class="hero"><div class="eyebrow">LUNO</div><h1>Кино без лишнего.</h1><p>Собственный интерфейс LUNO. Источники и воспроизведение будут работать внутри LUNO, без показа интерфейса Prisma.</p></section><section class="section"><div class="section-head"><h2 id="sectionTitle">LUNO</h2><span class="hint" id="status">Готово</span></div><div id="grid" class="grid"></div></section></main></div><script type="module" src="./luno/ui.js"></script></body></html>
